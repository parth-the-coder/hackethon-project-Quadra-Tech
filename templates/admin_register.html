<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Registration | OpsPilot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="min-height: 100vh; display: grid; place-items: center; background: #0f172a;">
  <div style="width: min(450px, calc(100% - 32px)); background: #ffffff; border-radius: 20px; padding: 36px 32px; box-shadow: var(--shadow-lg);">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 24px;">
      <div class="brand-mark">✦</div>
      <b style="font-size: 20px; font-family: 'Manrope', sans-serif;">OpsPilot Admin Setup</b>
    </div>

    <h2 style="font-size: 24px; margin-bottom: 6px;">Register Administrator</h2>
    <p style="font-size: 13.5px; color: var(--muted); margin-bottom: 24px;">
      Create the primary institute administrator account. Only registered administrators can provision student login credentials.
    </p>

    {% if error %}
    <div style="background: var(--red-soft); color: var(--red); padding: 12px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 18px; border: 1px solid #fecaca;">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/admin/register">
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 6px;">Administrator Full Name</label>
        <input type="text" name="name" class="input-field" placeholder="e.g. Director Mehta" required>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 6px;">Official Admin Email</label>
        <input type="email" name="email" class="input-field" placeholder="admin@trainwise.com" required>
      </div>

      <div style="margin-bottom: 24px;">
        <label style="display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 6px;">Set Secure Password</label>
        <input type="password" name="password" class="input-field" placeholder="••••••••" required>
      </div>

      <button type="submit" class="button button-dark" style="width: 100%; height: 46px;">Create Admin Account ↗</button>
    </form>

    <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); text-align: center;">
      Already registered? <a href="/admin_login" style="color: var(--green); font-weight: 700;">Sign In</a> | <a href="/" style="color: var(--muted);">Back to Home</a>
    </div>
  </div>
</body>
</html>
